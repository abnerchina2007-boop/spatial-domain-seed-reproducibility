method: BANKSY
package: pybanksy
version: "1.3.5"
repository: https://github.com/prabhakarlab/Banksy_py
commit: TO VERIFY
input_modalities: [expression, spatial_coordinates]
graph:
  spatial_neighbors: 15
  weight_decay: scaled_gaussian
parameters:
  lambda: 0.2
  max_m: 0
  variance_balance: false
preprocessing:
  zero_variance_safeguard: "variance > 1e-12 in own and neighborhood expression"
  pca_components: 20
  pca_solver: arpack
  pca_random_state: 0
readout:
  method: sklearn_GaussianMixture
  covariance_type: tied
  n_init: 5
  max_iter: 500
  reg_covar: 0.000001
  random_state: run_seed
  n_components: requested_k
spatial_refinement: none

